# ============================================================
# Task 1.1 · 安全工具链集成 —— 供应链安全防线（智谱风险 3.1/3.2）
#
# 四件套防线：
#   1) semgrep        多语言静态分析（framework/engine/scripts/*.py）
#   2) bandit         Python 安全审计（-r framework/engine/scripts）
#   3) pip-audit      依赖漏洞扫描（requirements.txt 如存在，否则跳过）
#   4) 恶意样例回归   scan-sensitive.py 对 malicious-samples/ 必须全部拦截（非零退出）
#
# 说明：
#   - 恶意样例（malicious-samples/）是攻击面检测的"黄金对比例"，仅供步骤 4 显式引用；
#     semgrep/bandit 通过路径作用域 / 排除参数跳过该夹具目录，避免污染真实扫描。
#   - 该目录下的安全基线：bandit 当前在 auto-import.py 存在 1 处 High（subprocess shell=True）
#     待清理；本流水线作为防线闸门会在修复前保持失败，属预期行为。
# 触发：main 分支 push / PR / 手动
# ============================================================
name: "ixxi · 安全防线（Task 1.1）"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            # 手动触发，便于本地验证流水线

permissions:
  contents: read                # 只读最小权限，供应链防线不需要写仓库

jobs:
  supply-chain-security:
    name: 供应链安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # —— 检出 + Python 环境 ——
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装安全工具（semgrep / bandit / pip-audit）
        run: |
          python -m pip install --upgrade pip
          # 注意：工具版本未锁定（保持跟进安全更新）；
          # 若追求构建可复现性，可改为 pin 具体版本号。
          pip install semgrep bandit pip-audit

      # —— 1) semgrep 多语言静态分析 ——
      - name: "semgrep 静态分析（framework/engine/scripts/*.py）"
        run: |
          # --config auto：按仓库语言自动选择规则集（需访问 semgrep.dev 规则注册表）
          # --metrics=off：关闭遥测，避免外发元数据
          # --error：发现任何问题即退出非零，作为防线闸门
          # 作用域仅 scripts/ 直接子文件；恶意样例位于子目录，天然不在扫描范围
          semgrep --config auto --metrics=off --error framework/engine/scripts/*.py

      # —— 2) bandit Python 安全审计 ——
      - name: "bandit Python 安全审计（-r framework/engine/scripts）"
        run: |
          # -r 递归扫描 engine/scripts（含恶意样例所在子目录）
          # -x 排除恶意样例夹具目录：夹具是"故意恶意"的，应交给步骤 4 单独回归验证
          # -ll：中危及以上即失败，过滤 Low/Info 级噪音
          bandit -r framework/engine/scripts -x '*/malicious-samples/*' -ll -q

      # —— 3) pip-audit 依赖漏洞 ——
      - name: "pip-audit 依赖漏洞（requirements.txt 如存在）"
        run: |
          # ixxi 当前零第三方依赖（engine 脚本仅用 Python 标准库），无 requirements.txt 时跳过；
          # 一旦引入依赖，本步骤自动接管依赖 CVE 审计。
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "未找到 requirements.txt，跳过 pip-audit（当前框架零第三方依赖）"
          fi

      # —— 4) 恶意样例回归：scan-sensitive 必须全部拦截 ——
      - name: "恶意样例回归（scan-sensitive 全拦截）"
        run: |
          set -euo pipefail
          # 反证法：样例集是攻击面检测的"黄金对比例"。
          # 若扫描器漏检（退出码 0），说明防线失效，流水线必须失败。
          set +e
          out="$(python framework/engine/scripts/scan-sensitive.py \
                    --repo framework/engine/scripts/malicious-samples 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "—— scan-sensitive 退出码: $rc ——"
          if [ "$rc" -eq 0 ]; then
            echo "::error::恶意样例回归失败：扫描器未拦截恶意样例（退出码 0）"
            exit 1
          fi
          # 断言 5 类攻击面全部命中（类别标签来自 scan-sensitive 输出）
          miss=0
          for cat in "Base64解码执行" "环境变量外泄" "路径穿越" ".git/hooks注入" "依赖投毒"; do
            if ! printf '%s\n' "$out" | grep -Fq "攻击面:$cat"; then
              echo "::error::恶意样例回归失败：未命中攻击面「$cat」"
              miss=$((miss+1))
            fi
          done
          if [ "$miss" -gt 0 ]; then
            exit 1
          fi
          echo "✅ 恶意样例回归通过：5 类攻击面全部命中，scan-sensitive 非零退出（$rc）"
