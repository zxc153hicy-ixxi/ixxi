# 知识库标签体系 · 机制模板（framework）
# 按领域组织，新增领域只需加一个 section
# /enrich 自动读取此配置，判断领域→匹配标签→写入 frontmatter
# kb-query 用 _synonyms 做同义词扩展，解决"踩点 vs 信息收集 vs 侦查"类检索盲区
#
# 分层（对应设计决策 #2 场景注册表切分原则）：
#   机制（本文件）归 framework —— 字段结构 + 受控词表机制 + 指标机制，任何人可复用
#   数据（domains 具体领域 + _synonyms 具体映射）归 personal —— 实例在 personal/ 配置登记自己的领域
# 新实例：在本结构下登记自己的学习/知识领域；个人领域（如"网络安全""系统架构"）不入 framework。

# ============================================================
# 全局默认内容类型（所有领域共用，除非领域自定义覆盖）
# ============================================================
_content_types:
  - 书籍
  - 教程
  - 文章
  - 笔记
  - 实验记录
  - Writeup
  - 工具文档
  - 面试题

# ============================================================
# 领域定义（机制：字段结构；数据：实例自填）
# ============================================================
# 每个 domain 的字段：
#   label         人类可读领域名（必填）
#   path_key      领域数据目录名（必填）
#   subdomains    子领域标签列表
#   phases        阶段标签列表（可选）
#   content_types 领域自定义内容类型（可选，覆盖全局默认）
#
# 示例（占位，实例请替换为自己的领域）：
# domains:
#   示例领域:
#     label: "示例领域"
#     path_key: "示例领域"
#     subdomains: [子领域一, 子领域二]
#     phases: [阶段一, 阶段二]
domains: {}

# ============================================================
# 同义词映射（kb-query L2 降级检索 + 零命中扩展用）
# 数据归 personal：实例自填"信息收集 → 侦查/踩点/侦察"等映射
# ============================================================
_synonyms: {}

# ============================================================
# 检索质量追踪指标（kb-query 自动更新，/lint 读取）
# 机制归 framework：结构固定，数值由实例运行累积
# ============================================================
_metrics:
  last_aggregated: null
  total_queries: 0
  l1_hit_rate: 0.0
  l2_fallback_rate: 0.0
  l3_fallback_rate: 0.0
  synonyms_used_count: 0
  feedback_positive_rate: 0.0
  feedback_collection_rate: 0.0
  # 某 subdomain tags 被指不准 ≥3 次 → 标记 degraded
  degraded_subdomains: {}
  # 示例: { "网络协议": { "count": 3, "last_issue": "2026-07-21", "root_cause": "tags与内容不匹配" } }
