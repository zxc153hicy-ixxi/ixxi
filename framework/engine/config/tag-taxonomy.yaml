# 知识库标签体系 · V1.1
# 按领域组织，新增领域只需加一个 section
# /enrich 自动读取此配置，判断领域→匹配标签→写入 frontmatter
# kb-query 用 _synonyms 做同义词扩展，解决"踩点 vs 信息收集 vs 侦查"类检索盲区

# ============================================================
# 全局默认内容类型（所有领域共用，除非领域自定义覆盖）
# ============================================================
_content_types:
  - 书籍
  - 教程
  - 文章
  - 笔记
  - 实验记录
  - Writeup
  - 工具文档
  - 面试题

# ============================================================
# 领域定义
# ============================================================
domains:

  网络安全:
    label: "网络安全"
    path_key: "网络安全"
    subdomains:
      - Web安全
      - 渗透测试
      - 逆向工程
      - 二进制安全
      - 内网安全
      - 漏洞分析
      - 网络协议
      - 密码学
      - 移动安全
      - 恶意代码
      - 安全运维
      - 应急响应
      - 威胁情报
      - CTF
      - 工具使用
      - 社会工程学
      - 基础理论
    phases:
      - 信息收集
      - 漏洞扫描
      - 漏洞利用
      - 后渗透/提权
      - 持久化
      - 横向移动
      - 痕迹清除
      - 报告编写
      - 综合/全流程

  系统架构:
    label: "系统架构设计师"
    path_key: "系统架构设计师"
    subdomains:
      - 架构设计
      - 数据库
      - 操作系统
      - 计算机网络
      - 软件工程
      - 项目管理
      - 安全性设计
    content_types:
      - 教材
      - 真题
      - 押题
      - 一本通
      - 论文范文
      - 知识点归纳
      - 默写本
      - 速记手册

  网络工程:
    label: "华为数通"
    path_key: "华为数通-HCIP"
    subdomains:
      - 路由交换
      - MPLS
      - BGP
      - IPv6
      - 网络管理
      - SDN
      - 广域网
    content_types:
      - 培训教材
      - 课件
      - 实验手册

  云计算:
    label: "云计算"
    path_key: "HCIA-Cloud-Service"
    subdomains:
      - IaaS
      - PaaS
      - SaaS
      - 虚拟化
      - 容器
      - Kubernetes
      - 云原生
    content_types:
      - 培训教材
      - 课件
      - 实验手册

# ============================================================
# 同义词映射（kb-query L2 降级检索 + 零命中扩展用）
# ============================================================
_synonyms:
  信息收集:
    - 侦查
    - 踩点
    - 侦察
    - 前期信息
    - 资产发现
  漏洞挖掘:
    - 漏洞发现
    - 挖洞
    - 漏洞检测
    - 安全检测
  渗透测试:
    - 渗透
    - 安全测试
    - 攻防
  SQL注入:
    - SQLi
    - 注入攻击
  XSS:
    - 跨站脚本
  CSRF:
    - 跨站请求伪造
  文件上传:
    - 上传漏洞
    - 任意文件上传
  越权:
    - 权限绕过
    - 未授权访问
    - 访问控制
  子域名:
    - 域名爆破
    - 子域名枚举
    - DNS枚举

# ============================================================
# 检索质量追踪指标（kb-query 自动更新，/lint 读取）
# ============================================================
_metrics:
  last_aggregated: null
  total_queries: 0
  l1_hit_rate: 0.0
  l2_fallback_rate: 0.0
  l3_fallback_rate: 0.0
  synonyms_used_count: 0
  feedback_positive_rate: 0.0
  feedback_collection_rate: 0.0
  # 某 subdomain tags 被指不准 ≥3 次 → 标记 degraded
  degraded_subdomains: {}
  # 示例: { "网络协议": { "count": 3, "last_issue": "2026-07-21", "root_cause": "tags与内容不匹配" } }
